name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ewz:
    name: Symfony ${{ matrix.symfony }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    env:
      # Composer >= 2.9 refuses packages with security advisories, which covers every old Symfony/Twig release we still test.
      COMPOSER_NO_BLOCKING: 1

    strategy:
      fail-fast: false
      matrix:
        php: [7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2]
        symfony: [2.8, 3.4, 4.4, 5.2, 6.0, 7.0]
        exclude:
          # Symfony 5 requires PHP >= 7.2
          - php: 7.1
            symfony: 5.2
          # Symfony 6 requires PHP >= 8.0
          - php: 7.1
            symfony: 6.0
          - php: 7.2
            symfony: 6.0
          - php: 7.3
            symfony: 6.0
          - php: 7.4
            symfony: 6.0
          # Symfony 7 requires PHP >= 8.2
          - php: 7.1
            symfony: 7.0
          - php: 7.2
            symfony: 7.0
          - php: 7.3
            symfony: 7.0
          - php: 7.4
            symfony: 7.0
          - php: 8.0
            symfony: 7.0
          - php: 8.1
            symfony: 7.0
        include:
          # Symfony 8 requires PHP >= 8.4
          - php: 8.4
            symfony: 8.0
          - php: 8.5
            symfony: 8.0
          - php: 8.4
            symfony: 7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer require "symfony/form:^${{ matrix.symfony }}" --no-update
          composer require "symfony/framework-bundle:^${{ matrix.symfony }}" --no-update
          composer require "symfony/security-bundle:^${{ matrix.symfony }}" --no-update
          composer require "symfony/validator:^${{ matrix.symfony }}" --no-update

      - name: Install dependencies PHP
        run: |
          composer install

      - name: Run tests
        run: vendor/bin/phpunit
